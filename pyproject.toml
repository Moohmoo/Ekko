[project]
name = "ekko"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed", email = "mohamed@local" }
]
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.104.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
ekko = "ekko.ui.cli:main"

