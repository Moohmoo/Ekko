[project]
name = "ekko"
version = "0.1.0"
description = "Ambient cognitive buffer and blindspot sentinel"
readme = "README.md"
authors = [
    { name = "Mohamed", email = "mohamed@local" }
]
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "litellm>=1.104.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

[project.scripts]
ekko = "ekko.daemon.service:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
