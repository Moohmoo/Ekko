[package]
name = "ekko-desktop-notch"
version = "0.1.0"
description = "Ekko V2 Desktop Notch Client"
authors = ["Ekko Team"]
edition = "2021"

[lib]
name = "ekko_desktop_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["net", "io-util", "sync", "macros", "rt-multi-thread"] }
futures-util = "0.3"
