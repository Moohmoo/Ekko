<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ekkoMascotGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Ambient glow -->
  <circle cx="50" cy="54" r="38" fill="#00f2fe" opacity="0.18" filter="url(#cyanGlow)"/>
  <!-- Left satellite hand -->
  <circle cx="8" cy="50" r="3.2" fill="#38bdf8"/>
  <!-- Right satellite hand -->
  <circle cx="92" cy="50" r="3.2" fill="#38bdf8"/>
  <!-- Mascot body pear droplet -->
  <path d="M 50 8 C 68 26, 86 52, 86 70 C 86 88, 70 94, 50 94 C 30 94, 14 88, 14 70 C 14 52, 32 26, 50 8 Z" fill="url(#ekkoMascotGradient)" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Eyes -->
  <g fill="#040814">
    <ellipse cx="40" cy="50" rx="3.5" ry="5"/>
    <circle cx="39" cy="48" r="1.2" fill="#ffffff"/>
    <ellipse cx="60" cy="50" rx="3.5" ry="5"/>
    <circle cx="59" cy="48" r="1.2" fill="#ffffff"/>
  </g>
  <!-- Friendly smile -->
  <path d="M 44 60 Q 50 65 56 60" fill="none" stroke="#040814" stroke-width="1.5" stroke-linecap="round"/>
</svg>
